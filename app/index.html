<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schnell lesen</title>
<style>
:root {
  --bg: #f4f2ed;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --panel: #ffffff;
  --border: #e3e0d9;
  --accent: #d6261c;
  --btn: #f1efea;
  --btn-hover: #e6e3dc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --fg: #f2f2f2; --muted: #9a9aa0; --panel: #1f2024;
    --border: #2e2f35; --accent: #ff4d3d; --btn: #26272c; --btn-hover: #32333a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1012; --fg: #f2f2f2; --muted: #9a9aa0; --panel: #1f2024;
  --border: #2e2f35; --accent: #ff4d3d; --btn: #26272c; --btn-hover: #32333a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
main { max-width: 920px; margin: 0 auto; padding: 32px 16px 48px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
h1 b { color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
textarea {
  display: block;
  width: 100%;
  min-height: 46vh;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--fg);
  font: inherit;
  line-height: 1.6;
  resize: vertical;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.bar .meta { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
button {
  height: 42px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--btn);
  color: var(--fg);
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
button:hover { background: var(--btn-hover); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: 0.5; cursor: default; }
.link { background: none; border: 0; padding: 0; height: auto; color: var(--muted); }
.link:hover { background: none; color: var(--fg); }
#reader-view[hidden], #input-view[hidden] { display: none; }
#reader-host .rsvp { border: 1px solid var(--border); }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
@media (max-width: 560px) {
  .bar .meta { margin-left: 0; width: 100%; }
}
/* Schnell-Lesen – Leseransicht. Alles ist unter .rsvp gekapselt. */
.rsvp {
  --rsvp-axis: 38; /* Achse in % der Breite */
  --rsvp-font-size: 48px;
  --rsvp-bg: #fbfaf7;
  --rsvp-fg: #1d1d1f;
  --rsvp-muted: #6e6e73;
  --rsvp-line: #c9c6bf;
  --rsvp-accent: #d6261c;
  --rsvp-panel: #ffffff;
  --rsvp-border: #e3e0d9;
  --rsvp-btn: #f1efea;
  --rsvp-btn-hover: #e6e3dc;

  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  padding: 20px;
  background: var(--rsvp-bg);
  color: var(--rsvp-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  outline: none;
  border-radius: 14px;
}
.rsvp *, .rsvp *::before, .rsvp *::after { box-sizing: border-box; }

.rsvp[data-theme="dark"] {
  --rsvp-bg: #16171a;
  --rsvp-fg: #f2f2f2;
  --rsvp-muted: #9a9aa0;
  --rsvp-line: #45464c;
  --rsvp-accent: #ff4d3d;
  --rsvp-panel: #1f2024;
  --rsvp-border: #2e2f35;
  --rsvp-btn: #26272c;
  --rsvp-btn-hover: #32333a;
}
@media (prefers-color-scheme: dark) {
  .rsvp[data-theme="auto"] {
    --rsvp-bg: #16171a;
    --rsvp-fg: #f2f2f2;
    --rsvp-muted: #9a9aa0;
    --rsvp-line: #45464c;
    --rsvp-accent: #ff4d3d;
    --rsvp-panel: #1f2024;
    --rsvp-border: #2e2f35;
    --rsvp-btn: #26272c;
    --rsvp-btn-hover: #32333a;
  }
}

/* ---------- Lesefeld mit Achse */
.rsvp-stage {
  position: relative;
  height: calc(var(--rsvp-font-size) * 2.6);
  min-height: 120px;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  background: var(--rsvp-panel);
  border: 1px solid var(--rsvp-border);
  border-radius: 10px;
}
.rsvp-guide {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px solid var(--rsvp-line);
}
.rsvp-guide-top { top: 18%; }
.rsvp-guide-bottom { bottom: 18%; }
/* Kerbe über und unter dem Fixierungsbuchstaben */
.rsvp-guide::after {
  content: "";
  position: absolute;
  left: calc(var(--rsvp-axis) * 1% - 1px);
  width: 2px;
  height: calc(var(--rsvp-font-size) * 0.32);
  background: var(--rsvp-line);
}
.rsvp-guide-top::after { top: 0; }
.rsvp-guide-bottom::after { bottom: 0; }

.rsvp-word {
  position: absolute;
  top: 50%;
  left: 0;
  margin-top: calc(var(--rsvp-font-size) * -0.62);
  white-space: pre;
  font-size: var(--rsvp-font-size);
  line-height: 1.24;
  font-weight: 500;
  letter-spacing: 0.01em;
  font-variant-ligatures: none;
  will-change: transform;
}
.rsvp-orp { color: var(--rsvp-accent); font-weight: 700; }

/* ---------- Startknopf: sichtbar, bis zum ersten Mal gestartet wurde */
.rsvp-start {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 56px;
  padding: 0 26px 0 20px;
  border: 0;
  border-radius: 28px;
  background: var(--rsvp-accent);
  color: #fff;
  font: inherit;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--rsvp-accent) 35%, transparent);
}
.rsvp-start:hover { filter: brightness(1.08); }
.rsvp-start:focus-visible { outline: 3px solid var(--rsvp-fg); outline-offset: 3px; }
.rsvp-start-icon { font-size: 18px; }
.rsvp-start small { font-size: 12px; font-weight: 500; opacity: 0.8; }
.rsvp:not(.is-started) .rsvp-word { visibility: hidden; }
.rsvp.is-started .rsvp-start { display: none; }

/* ---------- „✓ gespeichert“ neben dem Tempo */
.rsvp-saved {
  /* schwebt unter der Tempo-Zahl, nimmt keinen Platz in der Leiste */
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 1px;
  white-space: nowrap;
  font-size: 11px;
  color: var(--rsvp-muted);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.rsvp-saved.is-visible { opacity: 1; }

/* ---------- Kontext beim Pausieren */
.rsvp-context {
  min-height: 2.8em;
  max-height: 7.5em;
  overflow: auto;
  padding: 10px 14px;
  color: var(--rsvp-muted);
  background: var(--rsvp-panel);
  border: 1px solid var(--rsvp-border);
  border-radius: 10px;
  font-size: 16px;
  line-height: 1.55;
}
.rsvp-context[hidden] { display: block; visibility: hidden; }
.rsvp-context span[data-index] { cursor: pointer; }
.rsvp-context span[data-index]:hover { color: var(--rsvp-fg); }
.rsvp-context-current {
  color: var(--rsvp-fg);
  background: color-mix(in srgb, var(--rsvp-accent) 16%, transparent);
  border-radius: 3px;
}

/* ---------- Fortschritt und Status */
.rsvp-progress {
  height: 8px;
  background: var(--rsvp-btn);
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
}
.rsvp-progress-fill {
  height: 100%;
  width: 0;
  background: var(--rsvp-accent);
  transition: width 0.12s linear;
}
.rsvp-status {
  display: flex;
  justify-content: space-between;
  color: var(--rsvp-muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Bedienleiste */
/* Zwei feste Zeilen: oben Wiedergabe · Tempo · Regler, unten Ansicht.
   Nichts bricht um, auch nicht bei „1000 WPM“. */
.rsvp-controls {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  gap: 12px 16px;
}
.rsvp-controls > .rsvp-group:last-child { grid-column: 1 / -1; }
.rsvp-group { display: flex; align-items: center; gap: 6px; }
.rsvp-group:has(> .rsvp-saved) { position: relative; }
.rsvp-btn, .rsvp-select {
  appearance: none;
  min-width: 40px;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--rsvp-border);
  border-radius: 8px;
  background: var(--rsvp-btn);
  color: var(--rsvp-fg);
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
.rsvp-btn:hover, .rsvp-select:hover { background: var(--rsvp-btn-hover); }
.rsvp-btn:focus-visible, .rsvp-select:focus-visible, .rsvp-range:focus-visible {
  outline: 2px solid var(--rsvp-accent);
  outline-offset: 2px;
}
.rsvp-play {
  min-width: 56px;
  background: var(--rsvp-accent);
  border-color: var(--rsvp-accent);
  color: #fff;
}
.rsvp-play:hover { background: var(--rsvp-accent); filter: brightness(1.08); }
.rsvp-wpm {
  width: 96px; /* feste Breite, „1000 WPM“ passt hinein */
  text-align: center;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.rsvp-range {
  width: 100%;
  min-width: 0;
  margin: 0;
  accent-color: var(--rsvp-accent);
}
.rsvp-hint { color: var(--rsvp-muted); font-size: 12px; }

@media (max-width: 560px) {
  .rsvp { padding: 14px; }
  .rsvp-controls { grid-template-columns: auto minmax(0, 1fr); }
  .rsvp-range { grid-column: 1 / -1; }
}

</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Schnell <b>l</b>esen</h1>
      <p class="sub">Text einfügen, Tempo wählen, lesen. Das Auge bleibt auf dem roten Buchstaben.</p>
    </div>
    <button class="link" id="back" hidden>← Text bearbeiten</button>
  </header>

  <section id="input-view">
    <textarea id="text" placeholder="Text hier einfügen (⌘V) – zum Beispiel einen LinkedIn-Beitrag oder einen Artikel." spellcheck="false"></textarea>
    <div class="bar">
      <button class="primary" id="start" disabled>Lesen starten</button>
      <button id="paste">Aus Zwischenablage einfügen</button>
      <button id="clear">Leeren</button>
      <span class="meta" id="meta"></span>
    </div>
    <p class="note">Tipp: ⌘↩ startet den Leser. Der Text bleibt nur in diesem Browser gespeichert.</p>
  </section>

  <section id="reader-view" hidden>
    <div id="reader-host"></div>
  </section>
</main>

<script>
/*
 * Schnell-Lesen – RSVP-Lesekern
 * Zeigt Text Wort für Wort an einer festen Stelle. Ein Buchstabe pro Wort
 * (Optimal Recognition Point, ORP) ist farbig markiert und steht immer auf
 * derselben Achse, damit das Auge nicht springen muss.
 *
 * Läuft im Browser (globalThis.RSVP) und unter Node (module.exports) für Tests.
 */
(function (root) {
  'use strict';

  const MIN_WPM = 100;
  const MAX_WPM = 1000;
  const WPM_STEP = 25;
  const MAX_PIECE = 13; // längere Wörter werden getrennt
  const RAMP_WORDS = 5; // Anlauf nach Start: die ersten Wörter etwas langsamer

  const SENTENCE_END = /[.!?…]["'»«“”‘’)\]]*$/;
  const CLAUSE_END = /[,;:–—]["'»«“”‘’)\]]*$/;
  const LEADING_PUNCT = /^[\s"'»«“”‘’„(\[¿¡\-–—*•]+/;

  // ---------------------------------------------------------------- Logik

  /** Index des Fixierungsbuchstabens, Satzzeichen am Wortanfang werden übersprungen. */
  function orpIndex(word) {
    const lead = (word.match(LEADING_PUNCT) || [''])[0].length;
    const core = word.slice(lead).replace(/[^\p{L}\p{N}]+$/u, '');
    const n = core.length;
    let i;
    if (n <= 1) i = 0;
    else if (n <= 5) i = 1;
    else if (n <= 9) i = 2;
    else if (n <= 13) i = 3;
    else i = 4;
    return Math.min(lead + i, Math.max(word.length - 1, 0));
  }

  /** Trennt überlange Wörter in Stücke mit Bindestrich. */
  function splitLong(word) {
    if (word.length <= MAX_PIECE) return [word];
    // An vorhandenen Bindestrichen trennen, wenn möglich
    const parts = word.split('-');
    if (parts.length > 1 && parts.every(Boolean)) {
      return parts.flatMap((p, i) => {
        const pieces = chop(p);
        if (i < parts.length - 1) pieces[pieces.length - 1] += '-';
        return pieces;
      });
    }
    return chop(word);
  }

  /** Teilt ein Wort ohne Bindestrich in gleich lange Stücke. */
  function chop(word) {
    if (word.length <= MAX_PIECE) return [word];
    const pieces = Math.ceil(word.length / (MAX_PIECE - 2));
    const size = Math.ceil(word.length / pieces);
    const out = [];
    for (let i = 0; i < word.length; i += size) {
      const piece = word.slice(i, i + size);
      out.push(i + size < word.length ? piece + '-' : piece);
    }
    // Ein Rest aus nur Satzzeichen hängt am vorigen Stück
    if (out.length > 1 && !/[\p{L}\p{N}]/u.test(out[out.length - 1])) {
      const tail = out.pop();
      out[out.length - 1] = out[out.length - 1].replace(/-$/, '') + tail;
    }
    return out;
  }

  /**
   * Zerlegt Text in Tokens: { text, orp, factor, sentenceEnd, paragraphEnd }.
   * factor ist der Zeitfaktor relativ zur Grunddauer eines Worts.
   */
  function tokenize(text) {
    const tokens = [];
    const paragraphs = String(text || '')
      .replace(/\r\n?/g, '\n')
      .split(/\n\s*\n+/)
      .map((p) => p.trim())
      .filter(Boolean);

    paragraphs.forEach((para) => {
      const words = para.split(/\s+/).filter(Boolean);
      words.forEach((raw, wi) => {
        const pieces = splitLong(raw);
        pieces.forEach((piece, pi) => {
          const lastPiece = pi === pieces.length - 1;
          const lastInPara = lastPiece && wi === words.length - 1;
          tokens.push(makeToken(piece, lastPiece, lastInPara));
        });
      });
    });
    return tokens;
  }

  function makeToken(text, wordEnd, paragraphEnd) {
    const sentenceEnd = wordEnd && SENTENCE_END.test(text);
    const clauseEnd = wordEnd && !sentenceEnd && CLAUSE_END.test(text);
    let factor = 1;
    if (paragraphEnd) factor = 2.8;
    else if (sentenceEnd) factor = 2.2;
    else if (clauseEnd) factor = 1.5;
    if (text.replace(/[^\p{L}\p{N}]/gu, '').length >= 9) factor *= 1.3;
    if (/\d/.test(text)) factor *= 1.3;
    return {
      text,
      orp: orpIndex(text),
      factor,
      sentenceEnd: sentenceEnd || paragraphEnd,
      paragraphEnd,
    };
  }

  /**
   * Fasst Tokens zu Einblendungen zusammen (1–3 Wörter).
   * Eine Einblendung endet immer am Satzende, damit Pausen erhalten bleiben.
   */
  function buildFrames(tokens, wordsPerFrame) {
    const n = Math.max(1, Math.min(3, wordsPerFrame | 0 || 1));
    const frames = [];
    let i = 0;
    while (i < tokens.length) {
      const group = [tokens[i]];
      while (
        group.length < n &&
        i + group.length < tokens.length &&
        !group[group.length - 1].sentenceEnd &&
        !/-$/.test(group[group.length - 1].text)
      ) {
        group.push(tokens[i + group.length]);
      }
      frames.push(makeFrame(group, i));
      i += group.length;
    }
    return frames;
  }

  function makeFrame(group, start) {
    const text = group.map((t) => t.text).join(' ');
    const last = group[group.length - 1];
    // Zeit: ein Wort braucht seine Grunddauer, die längste Pause zählt einmal
    const pause = Math.max(...group.map((t) => t.factor));
    const factor = group.length === 1 ? pause : group.length - 1 + pause;
    return {
      text,
      orp: group.length === 1 ? group[0].orp : orpIndex(text),
      factor,
      start, // Index des ersten Tokens
      words: group.length,
      sentenceEnd: last.sentenceEnd,
      paragraphEnd: last.paragraphEnd,
    };
  }

  /** Indizes der Einblendungen, mit denen ein Satz beginnt. */
  function sentenceStarts(frames) {
    const starts = frames.length ? [0] : [];
    frames.forEach((f, i) => {
      if (f.sentenceEnd && i + 1 < frames.length) starts.push(i + 1);
    });
    return starts;
  }

  /** Ziel beim Satzsprung. dir = -1 zurück, +1 vor. */
  function sentenceJump(starts, index, dir) {
    if (!starts.length) return 0;
    let cur = 0;
    for (let k = 0; k < starts.length; k++) if (starts[k] <= index) cur = k;
    if (dir > 0) return cur + 1 < starts.length ? starts[cur + 1] : starts[cur];
    // Zurück: steht man mitten im Satz, an dessen Anfang; sonst einen Satz davor
    if (index - starts[cur] > 1) return starts[cur];
    return starts[Math.max(0, cur - 1)];
  }

  function baseDelay(wpm) {
    return 60000 / clampWpm(wpm);
  }

  function clampWpm(wpm) {
    return Math.max(MIN_WPM, Math.min(MAX_WPM, Math.round(wpm) || 300));
  }

  /** Dauer einer Einblendung in ms. rampStep zählt die Einblendungen seit Start. */
  function frameDelay(frame, wpm, rampStep) {
    const ramp = rampStep < RAMP_WORDS ? 1 + (RAMP_WORDS - rampStep) * 0.15 : 1;
    return baseDelay(wpm) * frame.factor * ramp;
  }

  function formatDuration(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(s / 60);
    return m ? `${m}:${String(s % 60).padStart(2, '0')} min` : `${s} s`;
  }

  // ---------------------------------------------------------------- Speicher

  const DEFAULTS = { wpm: 300, wordsPerFrame: 1, fontSize: 48, theme: 'auto', showContext: true };
  const STORAGE_KEY = 'schnell-lesen:settings';

  const localStore = {
    load() {
      try {
        return Promise.resolve(JSON.parse(localStorage.getItem(STORAGE_KEY)) || {});
      } catch (e) {
        return Promise.resolve({});
      }
    },
    save(obj) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      } catch (e) {
        /* privater Modus o. Ä. – Einstellungen gelten dann nur für diese Sitzung */
      }
    },
  };

  // ---------------------------------------------------------------- Oberfläche

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function button(cls, label, title) {
    const b = el('button', 'rsvp-btn ' + cls, label);
    b.type = 'button';
    if (title) {
      b.title = title;
      b.setAttribute('aria-label', title);
    }
    return b;
  }

  /**
   * Baut den Leser in container.
   * opts: { text, storage, onClose, autoplay, keyTarget }
   * Rückgabe: { play, pause, toggle, setText, destroy }
   */
  function createReader(container, opts) {
    opts = opts || {};
    const storage = opts.storage || localStore;
    const keyTarget = opts.keyTarget || document;
    let settings = Object.assign({}, DEFAULTS);

    let tokens = [];
    let frames = [];
    let starts = [];
    let prefix = [0]; // Präfixsummen der Zeitfaktoren für die Restzeit
    let index = 0;
    let playing = false;
    let timer = null;
    let rampStep = 0;
    let destroyed = false;

    // --- DOM
    const rootEl = el('div', 'rsvp');
    rootEl.tabIndex = -1;

    const stage = el('div', 'rsvp-stage');
    const lineTop = el('div', 'rsvp-guide rsvp-guide-top');
    const lineBottom = el('div', 'rsvp-guide rsvp-guide-bottom');
    const wordBox = el('div', 'rsvp-word');
    const pre = el('span', 'rsvp-pre');
    const orp = el('span', 'rsvp-orp');
    const post = el('span', 'rsvp-post');
    wordBox.append(pre, orp, post);
    // Startknopf: Der Text läuft erst los, wenn man ihn drückt
    const startBtn = el('button', 'rsvp-start');
    startBtn.type = 'button';
    startBtn.append(el('span', 'rsvp-start-icon', '▶'), el('span', null, 'Start'), el('small', null, 'Leertaste'));
    stage.append(lineTop, wordBox, lineBottom, startBtn);

    const context = el('div', 'rsvp-context');

    const progress = el('div', 'rsvp-progress');
    const progressFill = el('div', 'rsvp-progress-fill');
    progress.append(progressFill);
    progress.title = 'Klicken, um an diese Stelle zu springen';

    const status = el('div', 'rsvp-status');
    const statusPos = el('span', 'rsvp-status-pos');
    const statusLeft = el('span', 'rsvp-status-left');
    status.append(statusPos, statusLeft);

    const controls = el('div', 'rsvp-controls');
    const btnBack = button('rsvp-back', '⏮', 'Satz zurück (←)');
    const btnPlay = button('rsvp-play', '▶', 'Start/Pause (Leertaste)');
    const btnFwd = button('rsvp-fwd', '⏭', 'Satz vor (→)');
    const btnSlower = button('rsvp-slower', '−', 'Langsamer (↓)');
    const wpmLabel = el('span', 'rsvp-wpm');
    const btnFaster = button('rsvp-faster', '+', 'Schneller (↑)');
    const savedNote = el('span', 'rsvp-saved', '✓ gespeichert');
    const wpmRange = el('input', 'rsvp-range');
    Object.assign(wpmRange, { type: 'range', min: MIN_WPM, max: MAX_WPM, step: WPM_STEP });
    wpmRange.setAttribute('aria-label', 'Wörter pro Minute');

    const chunkSel = el('select', 'rsvp-select');
    chunkSel.setAttribute('aria-label', 'Wörter pro Einblendung');
    [1, 2, 3].forEach((n) => {
      const o = el('option', null, n === 1 ? '1 Wort' : `${n} Wörter`);
      o.value = String(n);
      chunkSel.append(o);
    });

    const btnSmaller = button('rsvp-smaller', 'A−', 'Schrift kleiner');
    const btnBigger = button('rsvp-bigger', 'A+', 'Schrift größer');
    const btnTheme = button('rsvp-theme', '◐', 'Hell/Dunkel wechseln');
    const btnClose = opts.onClose ? button('rsvp-close', '✕', 'Schließen (Esc)') : null;

    const groupNav = el('div', 'rsvp-group');
    groupNav.append(btnBack, btnPlay, btnFwd);
    const groupSpeed = el('div', 'rsvp-group');
    groupSpeed.append(btnSlower, wpmLabel, btnFaster, savedNote);
    const groupView = el('div', 'rsvp-group');
    groupView.append(chunkSel, btnSmaller, btnBigger, btnTheme);
    if (btnClose) groupView.append(btnClose);
    controls.append(groupNav, groupSpeed, wpmRange, groupView);

    const hint = el('div', 'rsvp-hint', 'Leertaste Start/Pause · ← → Satz · ↑ ↓ Tempo' + (btnClose ? ' · Esc schließen' : ''));

    rootEl.append(stage, context, progress, status, controls, hint);
    container.append(rootEl);

    // --- Darstellung

    function applySettings() {
      settings.wpm = clampWpm(settings.wpm);
      rootEl.style.setProperty('--rsvp-font-size', settings.fontSize + 'px');
      rootEl.dataset.theme = settings.theme;
      wpmLabel.textContent = settings.wpm + ' WPM';
      wpmRange.value = String(settings.wpm);
      chunkSel.value = String(settings.wordsPerFrame);
    }

    let savedTimer = null;

    /** Speichert die Einstellungen; showNote zeigt kurz „✓ gespeichert“ beim Tempo. */
    function persist(showNote) {
      storage.save({
        wpm: settings.wpm,
        wordsPerFrame: settings.wordsPerFrame,
        fontSize: settings.fontSize,
        theme: settings.theme,
        showContext: settings.showContext,
      });
      if (showNote) {
        savedNote.classList.add('is-visible');
        clearTimeout(savedTimer);
        savedTimer = setTimeout(() => savedNote.classList.remove('is-visible'), 1800);
      }
    }

    function rebuild(keepTokenIndex) {
      const tokenIdx = frames[index] ? frames[index].start : 0;
      frames = buildFrames(tokens, settings.wordsPerFrame);
      starts = sentenceStarts(frames);
      prefix = [0];
      frames.forEach((f) => prefix.push(prefix[prefix.length - 1] + f.factor));
      if (keepTokenIndex) {
        let k = 0;
        while (k + 1 < frames.length && frames[k + 1].start <= tokenIdx) k++;
        index = k;
      } else {
        index = 0;
      }
    }

    function render() {
      const f = frames[index];
      if (!f) {
        pre.textContent = '';
        orp.textContent = '';
        post.textContent = tokens.length ? '' : 'Kein Text';
        wordBox.style.transform = 'none';
        updateStatus();
        return;
      }
      pre.textContent = f.text.slice(0, f.orp);
      orp.textContent = f.text.charAt(f.orp);
      post.textContent = f.text.slice(f.orp + 1);
      alignToAxis();
      updateStatus();
      if (!playing) renderContext();
    }

    /** Verschiebt das Wort so, dass die Mitte des ORP-Buchstabens auf der Achse liegt. */
    function alignToAxis() {
      wordBox.style.transform = 'none';
      const stageRect = stage.getBoundingClientRect();
      const orpRect = orp.getBoundingClientRect();
      if (!stageRect.width) return;
      const axis = stageRect.left + stageRect.width * axisRatio();
      const center = orpRect.left + orpRect.width / 2;
      wordBox.style.transform = `translateX(${Math.round(axis - center)}px)`;
    }

    function axisRatio() {
      const v = parseFloat(getComputedStyle(rootEl).getPropertyValue('--rsvp-axis'));
      return isNaN(v) ? 0.38 : v / 100;
    }

    function updateStatus() {
      const total = frames.length;
      const pct = total ? (index / Math.max(1, total - 1)) * 100 : 0;
      progressFill.style.width = (total ? pct : 0) + '%';
      const wordNo = frames[index] ? frames[index].start + 1 : 0;
      statusPos.textContent = `Wort ${wordNo} von ${tokens.length}`;
      const remaining = (prefix[prefix.length - 1] - prefix[index]) * baseDelay(settings.wpm);
      statusLeft.textContent = 'noch ' + formatDuration(remaining);
      btnPlay.textContent = playing ? '⏸' : '▶';
      rootEl.classList.toggle('is-playing', playing);
    }

    function renderContext() {
      context.textContent = '';
      if (!settings.showContext || playing || !frames.length) {
        context.hidden = true;
        return;
      }
      context.hidden = false;
      // aktueller Satz, aktuelle Einblendung hervorgehoben
      let s = 0;
      for (const st of starts) if (st <= index) s = st;
      let e = s;
      while (e < frames.length - 1 && !frames[e].sentenceEnd) e++;
      for (let k = s; k <= e; k++) {
        const span = el('span', k === index ? 'rsvp-context-current' : null, frames[k].text);
        span.dataset.index = String(k);
        context.append(span, document.createTextNode(' '));
      }
    }

    // --- Ablauf

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;
      const f = frames[index];
      if (!f) return pause();
      const delay = frameDelay(f, settings.wpm, rampStep);
      timer = setTimeout(() => {
        if (index >= frames.length - 1) {
          pause();
          return;
        }
        index++;
        rampStep++;
        render();
        schedule();
      }, delay);
    }

    function play() {
      if (destroyed || !frames.length) return;
      if (index >= frames.length - 1) index = 0;
      rootEl.classList.add('is-started');
      playing = true;
      rampStep = 0;
      context.hidden = true;
      render();
      schedule();
    }

    function pause() {
      playing = false;
      clearTimeout(timer);
      updateStatus();
      renderContext();
    }

    function toggle() {
      playing ? pause() : play();
    }

    function jumpTo(i) {
      index = Math.max(0, Math.min(frames.length - 1, i));
      rampStep = 0;
      render();
      if (playing) schedule();
    }

    function changeWpm(delta) {
      settings.wpm = clampWpm(settings.wpm + delta);
      applySettings();
      updateStatus();
      persist(true);
    }

    function setText(text) {
      pause();
      rootEl.classList.remove('is-started');
      tokens = tokenize(text);
      rebuild(false);
      render();
    }

    // --- Ereignisse

    btnPlay.addEventListener('click', toggle);
    btnBack.addEventListener('click', () => jumpTo(sentenceJump(starts, index, -1)));
    btnFwd.addEventListener('click', () => jumpTo(sentenceJump(starts, index, +1)));
    btnSlower.addEventListener('click', () => changeWpm(-WPM_STEP));
    btnFaster.addEventListener('click', () => changeWpm(+WPM_STEP));
    wpmRange.addEventListener('input', () => {
      settings.wpm = clampWpm(+wpmRange.value);
      applySettings();
      updateStatus();
    });
    wpmRange.addEventListener('change', () => persist(true));
    chunkSel.addEventListener('change', () => {
      settings.wordsPerFrame = +chunkSel.value;
      rebuild(true);
      render();
      persist();
    });
    btnSmaller.addEventListener('click', () => {
      settings.fontSize = Math.max(24, settings.fontSize - 6);
      applySettings();
      render();
      persist();
    });
    btnBigger.addEventListener('click', () => {
      settings.fontSize = Math.min(120, settings.fontSize + 6);
      applySettings();
      render();
      persist();
    });
    btnTheme.addEventListener('click', () => {
      const dark =
        settings.theme === 'dark' ||
        (settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      settings.theme = dark ? 'light' : 'dark';
      applySettings();
      persist();
    });
    if (btnClose) btnClose.addEventListener('click', () => opts.onClose());

    progress.addEventListener('click', (ev) => {
      const r = progress.getBoundingClientRect();
      jumpTo(Math.round(((ev.clientX - r.left) / r.width) * (frames.length - 1)));
    });
    stage.addEventListener('click', toggle);
    context.addEventListener('click', (ev) => {
      const t = ev.target.closest('[data-index]');
      if (t) jumpTo(+t.dataset.index);
    });

    function onKey(ev) {
      if (destroyed || !rootEl.isConnected || !rootEl.getClientRects().length) return;
      const tag = (ev.composedPath()[0] || {}).tagName;
      if (tag === 'TEXTAREA' || (tag === 'INPUT' && ev.composedPath()[0].type !== 'range')) return;
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      let handled = true;
      switch (ev.key) {
        case ' ':
        case 'k':
          toggle();
          break;
        case 'ArrowLeft':
          jumpTo(sentenceJump(starts, index, -1));
          break;
        case 'ArrowRight':
          jumpTo(sentenceJump(starts, index, +1));
          break;
        case 'ArrowUp':
          changeWpm(+WPM_STEP);
          break;
        case 'ArrowDown':
          changeWpm(-WPM_STEP);
          break;
        case 'Escape':
          if (opts.onClose) opts.onClose();
          else pause();
          break;
        default:
          handled = false;
      }
      if (handled) {
        ev.preventDefault();
        ev.stopPropagation();
      }
    }
    keyTarget.addEventListener('keydown', onKey, true);

    let resizeRaf = 0;
    const ro = typeof ResizeObserver !== 'undefined'
      ? new ResizeObserver(() => {
          cancelAnimationFrame(resizeRaf);
          resizeRaf = requestAnimationFrame(alignToAxis);
        })
      : null;
    if (ro) ro.observe(stage);

    function destroy() {
      destroyed = true;
      pause();
      keyTarget.removeEventListener('keydown', onKey, true);
      if (ro) ro.disconnect();
      rootEl.remove();
    }

    // --- Start
    applySettings();
    setText(opts.text || '');
    storage.load().then((saved) => {
      if (destroyed) return;
      settings = Object.assign({}, DEFAULTS, saved || {});
      applySettings();
      rebuild(true);
      render();
      if (opts.autoplay) play();
    });
    rootEl.focus({ preventScroll: true });

    return { play, pause, toggle, setText, destroy };
  }

  const api = {
    MIN_WPM,
    MAX_WPM,
    orpIndex,
    splitLong,
    tokenize,
    buildFrames,
    sentenceStarts,
    sentenceJump,
    frameDelay,
    formatDuration,
    createReader,
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RSVP = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function () {
  'use strict';
  const TEXT_KEY = 'schnell-lesen:text';
  const $ = (id) => document.getElementById(id);
  const textEl = $('text');
  const startBtn = $('start');
  const meta = $('meta');
  let reader = null;

  function store(fn) { try { return fn(); } catch (e) { return null; } }

  function wordCount(t) {
    const m = t.trim().match(/\S+/g);
    return m ? m.length : 0;
  }

  function updateMeta() {
    const n = wordCount(textEl.value);
    startBtn.disabled = n === 0;
    const wpm = (store(() => JSON.parse(localStorage.getItem('schnell-lesen:settings'))) || {}).wpm || 300;
    meta.textContent = n ? `${n} Wörter · ca. ${RSVP.formatDuration((n / wpm) * 60000)} bei ${wpm} WPM` : '';
  }

  function showInput() {
    if (reader) { reader.destroy(); reader = null; }
    $('reader-view').hidden = true;
    $('input-view').hidden = false;
    $('back').hidden = true;
    updateMeta();
    textEl.focus();
  }

  function showReader() {
    const text = textEl.value;
    if (!wordCount(text)) return;
    store(() => localStorage.setItem(TEXT_KEY, text));
    $('input-view').hidden = true;
    $('reader-view').hidden = false;
    $('back').hidden = false;
    reader = RSVP.createReader($('reader-host'), { text, onClose: showInput, autoplay: false });
  }

  textEl.value = store(() => localStorage.getItem(TEXT_KEY)) || '';
  textEl.addEventListener('input', () => {
    updateMeta();
    store(() => localStorage.setItem(TEXT_KEY, textEl.value));
  });
  textEl.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); showReader(); }
  });
  startBtn.addEventListener('click', showReader);
  $('back').addEventListener('click', showInput);
  $('clear').addEventListener('click', () => {
    textEl.value = '';
    store(() => localStorage.removeItem(TEXT_KEY));
    updateMeta();
    textEl.focus();
  });
  $('paste').addEventListener('click', async () => {
    try {
      textEl.value = await navigator.clipboard.readText();
      store(() => localStorage.setItem(TEXT_KEY, textEl.value));
      updateMeta();
    } catch (e) {
      textEl.focus();
      meta.textContent = 'Zugriff auf die Zwischenablage verweigert – bitte mit ⌘V einfügen.';
    }
  });
  updateMeta();
})();
</script>
