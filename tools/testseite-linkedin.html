<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Testseite LinkedIn-Feed</title>
<style>
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f2ee; margin: 0; padding: 24px; }
  .feed { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 0 0 1px #e0dfdc; }
  .head { display: flex; justify-content: space-between; font-weight: 600; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bar { display: flex; justify-content: space-around; border-top: 1px solid #e0dfdc; margin-top: 8px; padding-top: 4px; }
  .bar button, .head button { background: none; border: 0; padding: 8px; color: #666; font: inherit; font-weight: 600; }
  .comments { margin-top: 8px; padding: 8px; background: #f7f7f7; border-radius: 6px; }
</style>
</head>
<body>
<!-- Nachbau der LinkedIn-Struktur (Stand Oktober 2026) mit denselben Ankern:
     role=listitem + componentkey, Kontrollmenü-Knopf, data-testid=expandable-text-box,
     Kommentarbereich mit componentkey*=commentsSectionContainer, Aktionsleiste. -->
<div class="feed" id="feed"></div>
<template id="post">
  <div role="listitem" componentkey="update-card-focusTEST">
    <div class="card">
      <div class="head"><span class="author"></span><button aria-label="Kontrollmenü für den Beitrag von Test">…</button></div>
      <p><span data-testid="expandable-text-box" class="clamp body"></span></p>
      <div class="bar">
        <span><button aria-label="Status des Reaktionsbuttons: Keine Reaktion">Gefällt mir</button></span>
        <span><button aria-label="Kommentieren">Kommentieren</button></span>
        <span><button aria-label="Reposten">Reposten</button></span>
        <span><button aria-label="Senden">Senden</button></span>
      </div>
      <div class="comments" componentkey="commentsSectionContainerTEST">
        <span data-testid="expandable-text-box">Toller Beitrag, danke fürs Teilen.</span>
        <button aria-label="Antworten">Antworten</button>
      </div>
    </div>
  </div>
</template>

<script>
  window.chrome = window.chrome || {};
  chrome.storage = { local: { _d: {}, get(k, cb) { cb({ [k]: this._d[k] }); }, set(o) { Object.assign(this._d, o); } } };
  chrome.runtime = {
    sendMessage(msg, cb) {
      if (msg.type === 'css') fetch('../extension/rsvp.css').then((r) => r.text()).then(cb);
    },
  };

  const LONG = 'Werkzeugbau statt Werkzeugkauf. Wer ein Projekt führt, kennt das: Das passende Werkzeug fehlt.\n\n' +
    'Heute baue ich es selbst. Mit KI braucht es dafür keine Programmierkenntnisse, sondern eine klare Vorstellung davon, ' +
    'was das Werkzeug leisten soll. Das Ergebnis ist selten perfekt, aber es ist da.';

  window.addPost = (author, text, { more = false, noText = false } = {}) => {
    const node = document.getElementById('post').content.firstElementChild.cloneNode(true);
    node.querySelector('.author').textContent = author;
    const box = node.querySelector('.body');
    if (noText) box.closest('p').remove();
    else {
      box.textContent = text;
      if (more) {
        const b = document.createElement('button');
        b.dataset.testid = 'expandable-text-button';
        b.setAttribute('data-testid', 'expandable-text-button');
        b.textContent = '… mehr';
        box.append(' ', b);
      }
    }
    // Kommentarleiste darf keinen Lesen-Knopf bekommen
    document.getElementById('feed').append(node);
    return node;
  };

  addPost('Andreas Paehge', LONG, { more: true });
  addPost('Kollegin', 'Kurzer Beitrag ohne mehr-Knopf.');
  addPost('Fotograf', '', { noText: true });
</script>
<script src="../extension/rsvp.js"></script>
<script src="../extension/content.js"></script>
<script src="../extension/linkedin.js"></script>
</body>
</html>
